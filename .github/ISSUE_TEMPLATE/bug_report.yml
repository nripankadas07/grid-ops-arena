name: Bug report
description: Report a reproducible defect
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and seed
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Python and operating system
    validations:
      required: true
